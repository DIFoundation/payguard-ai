[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Conservative target: avoids PUSH0/MCOPY in case the Aevum EVM lags behind Shanghai/Cancun.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
